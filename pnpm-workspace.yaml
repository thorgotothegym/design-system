packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # Only the Tailwind CLI's --watch mode uses it, and it ships prebuilt binaries.
  "@parcel/watcher": false
  esbuild: false

# Versions shared by several workspace packages live here so they cannot drift.
catalog:
  "@eslint/js": 10.0.1
  "@types/node": 26.4.1
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  eslint: 10.9.1
  react: 19.2.8
  react-dom: 19.2.8
  tsup: 9.0.0
  typescript: 7.0.2
  vitest: 5.0.5
