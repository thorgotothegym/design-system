name: Setup
description: >
  pnpm from the root package.json `packageManager`, Node from `.nvmrc`, the pnpm store cache, the
  local Turborepo cache and a frozen install. Every CI job starts with it.

inputs:
  turbo-cache-key:
    description: Name of the job, so each job keeps its own Turborepo cache.
    required: true

runs:
  using: composite
  steps:
    # No `version` input: the action reads `packageManager` from package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # Turborepo's local cache (.turbo/cache): no remote cache, so no token is needed. Keyed by
    # commit, restored from the latest run of the same job.
    - uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ inputs.turbo-cache-key }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ inputs.turbo-cache-key }}-${{ runner.os }}-

    - run: pnpm install --frozen-lockfile
      shell: bash
